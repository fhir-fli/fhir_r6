name: fhir_r6_cql
description: >-
  FHIR R6 binding for the model-independent `cql` engine: the R6
  ModelResolver and TerminologyProvider implementations that let the CQL
  engine execute against FHIR R6 data.
version: 0.6.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/cql

environment:
  sdk: ^3.5.0

dependencies:
  cql:
    path: ../../../cql
  fhir_r6: ^0.5.0
  fhir_r6_path: ^0.5.0
  ucum: ^0.9.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.29.0
