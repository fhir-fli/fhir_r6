name: fhir_r6_cql
description: >-
  FHIR R6 binding for the model-independent `cql` engine: the R6
  ModelResolver and TerminologyProvider implementations that let the CQL
  engine execute against FHIR R6 data.
version: 0.12.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_r6
issue_tracker: https://github.com/fhir-fli/fhir_r6/issues

topics:
  - fhir
  - hl7
  - healthcare
  - cql
  - interoperability

environment:
  sdk: ^3.5.0

dependencies:
  cql: ^0.6.0
  fhir_r6: ^0.12.0
  fhir_r6_path: ^0.12.0
  ucum: ^0.9.0
dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.0.0
