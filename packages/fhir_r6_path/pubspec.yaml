name: fhir_r6_path
description: >-
  FHIRPath for FHIR R6: the version binding for the model-independent
  fhirpath engine, with terminology support.
version: 0.6.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_r6
issue_tracker: https://github.com/fhir-fli/fhir_r6/issues

topics:
  - fhir
  - fhirpath
  - hl7
  - healthcare
  - interoperability

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0

dependencies:
  collection: ^1.19.1
  fhir_node: ^0.6.0
  fhir_path: ^0.13.0
  fhir_r6: ^0.6.0
  http: ^1.6.0
  meta: ^1.15.0
  ucum: ^0.9.0

dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.0.0
 