name: fhir_r6_mapping
description: >-
  FHIR Mapping Language (FML) engine for FHIR R6: parse StructureMaps and
  transform healthcare data between structures.
version: 0.7.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_r6
issue_tracker: https://github.com/fhir-fli/fhir_r6/issues

topics:
  - fhir
  - hl7
  - healthcare
  - mapping
  - interoperability

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  fhir_node: ^0.6.0
  fhir_r6: ^0.7.0
  fhir_r6_path: ^0.7.0
  http: ^1.6.0
  uuid: ^4.5.2
  xml: '>=6.6.1 <8.0.0'
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.0.0
